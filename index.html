<style>
/* Layout idea: a printed Bible lying open on the reader's chosen desk; the app frame takes the theme, the pages take the reading tone. */
:root{
  /* Linen (default): warm off-white frame, oxblood accent */
  --leather:#efe9df; --leather-2:#f8f4ec; --leather-3:#ffffff;
  --gilt:#8c2f39; --gilt-soft:#7a2530; --ribbon:#8c2f39;
  --chrome-ink:#2a2420; --chrome-muted:#776c62;
  --on-accent:#ffffff; --field:color-mix(in srgb,var(--chrome-ink) 6%,transparent); --good:#2f7a3f; --bad:#b3372f; --page-accent:#8c2f39;
  --desk:radial-gradient(ellipse at 50% 20%,#f6f1e8 0%,#e6ded1 80%);
  --paper:#f8f2e5; --paper-edge:#e9dfc8; --ink:#2a241b; --ink-muted:#857761; --rule:#e0d3b7;
  --hl-yellow:rgba(250,212,80,.48); --hl-green:rgba(126,200,120,.40); --hl-blue:rgba(110,170,240,.38); --hl-pink:rgba(245,130,170,.38); --hl-purple:rgba(170,130,235,.38);
  --display:"Newsreader", "Source Serif 4", Georgia, serif;
  --body:"Literata", Georgia, "Times New Roman", serif;
  --ui:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --greek:"Noto Serif", "Literata", serif; --hebrew:"Noto Serif Hebrew", "Noto Serif", serif;
  --fs:19px;
  color-scheme:light;
}
:root[data-ui="harbor"]{--leather:#dfe9ee;--leather-2:#eef4f7;--leather-3:#ffffff;--gilt:#16707d;--gilt-soft:#0f5e69;--ribbon:#c4502f;--chrome-ink:#17282e;--chrome-muted:#56707a;--on-accent:#ffffff;--good:#2f7a3f;--bad:#b3372f;--page-accent:#16707d;--desk:radial-gradient(ellipse at 50% 15%,#e6f0f4 0%,#bcd2db 85%);color-scheme:light}
:root[data-ui="rose"]{--leather:#f3e3e6;--leather-2:#faf0f2;--leather-3:#ffffff;--gilt:#b03a63;--gilt-soft:#962e53;--ribbon:#b03a63;--chrome-ink:#33202a;--chrome-muted:#86636f;--on-accent:#ffffff;--good:#2f7a3f;--bad:#b3372f;--page-accent:#b03a63;--desk:radial-gradient(ellipse at 50% 15%,#f8e8eb 0%,#e8c3cc 85%);color-scheme:light}
:root[data-ui="meadow"]{--leather:#e1ead9;--leather-2:#eff4ea;--leather-3:#ffffff;--gilt:#3d7a3a;--gilt-soft:#2f652d;--ribbon:#a5472f;--chrome-ink:#1f2b1d;--chrome-muted:#5d6f58;--on-accent:#ffffff;--good:#2f7a3f;--bad:#b3372f;--page-accent:#3d7a3a;--desk:radial-gradient(ellipse at 50% 15%,#e9f0e2 0%,#c3d4b6 85%);color-scheme:light}
:root[data-ui="walnut"]{--leather:#2a1d14;--leather-2:#35251a;--leather-3:#433021;--gilt:#e09a52;--gilt-soft:#f0b275;--ribbon:#b4473a;--chrome-ink:#f5e8d8;--chrome-muted:#b49c85;--on-accent:#21160e;--good:#9fd49a;--bad:#f2a49c;--page-accent:#9a6a2a;--desk:radial-gradient(ellipse at 50% 15%,#4a3222 0%,#1c130c 85%);color-scheme:dark}
:root[data-ui="forest"]{--leather:#0f2a1c;--leather-2:#153725;--leather-3:#1d4630;--gilt:#8fd694;--gilt-soft:#a9e4ad;--ribbon:#d26a5a;--chrome-ink:#e6f4e6;--chrome-muted:#8fb39a;--on-accent:#0b2015;--good:#9fd49a;--bad:#f2a49c;--page-accent:#9a6a2a;--desk:radial-gradient(ellipse at 50% 15%,#1f5236 0%,#0a1d13 85%);color-scheme:dark}
:root[data-ui="ocean"]{--leather:#0a2140;--leather-2:#0f2c52;--leather-3:#163a66;--gilt:#5cc8ff;--gilt-soft:#8fdbff;--ribbon:#ff7a6b;--chrome-ink:#e6f2ff;--chrome-muted:#8aa9c9;--on-accent:#06182e;--good:#9fd49a;--bad:#f2a49c;--page-accent:#9a6a2a;--desk:radial-gradient(ellipse at 50% 15%,#1b4a80 0%,#06162b 85%);color-scheme:dark}
:root[data-ui="plum"]{--leather:#2b1236;--leather-2:#381a46;--leather-3:#472357;--gilt:#f09ad9;--gilt-soft:#f7bde7;--ribbon:#ff7f9e;--chrome-ink:#f8e9f5;--chrome-muted:#bb98b5;--on-accent:#230d2c;--good:#9fd49a;--bad:#f2a49c;--page-accent:#9a6a2a;--desk:radial-gradient(ellipse at 50% 15%,#5a2a6e 0%,#1c0a24 85%);color-scheme:dark}
:root[data-ui="midnight"]{--leather:#121a24;--leather-2:#1b2530;--leather-3:#25313e;--gilt:#cfa955;--gilt-soft:#e6cd8f;--ribbon:#a32a3f;--chrome-ink:#ebe3d3;--chrome-muted:#97a2ae;--on-accent:#1a1408;--good:#9fd49a;--bad:#f2a49c;--page-accent:#9a6a2a;--desk:radial-gradient(ellipse at 50% 30%,#1f2b38 0%,#121a24 70%);color-scheme:dark}
:root[data-ui="dark"]{--leather:#000000;--leather-2:#0d0d0d;--leather-3:#1a1a1a;--gilt:#e8e8e8;--gilt-soft:#ffffff;--ribbon:#d14b4b;--chrome-ink:#ededed;--chrome-muted:#9a9a9a;--on-accent:#000000;--good:#9fd49a;--bad:#f2a49c;--page-accent:#9a6a2a;--desk:#000000;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{touch-action:manipulation;background:var(--desk);color:var(--chrome-ink);font-family:var(--ui);overflow:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible, a:focus-visible{outline:2px solid var(--gilt);outline-offset:2px}
.app{display:grid;grid-template-rows:auto 1fr auto;grid-template-columns:minmax(0,1fr);height:100%;overflow:hidden}
.top{min-width:0}

/* ---------- top bar ---------- */
.top{display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid color-mix(in srgb,var(--chrome-ink) 10%,transparent);background:color-mix(in srgb,var(--leather-2) 85%,transparent);backdrop-filter:blur(8px)}
.brand{display:flex;align-items:center;gap:9px;white-space:nowrap;color:var(--chrome-ink)}
.brand .mark{width:30px;height:30px;flex:none}
.brand .wm{font-family:"Newsreader",Georgia,serif;font-size:21px;font-weight:600;letter-spacing:-.01em;line-height:1}
.brand .wm em{font-style:normal;font-weight:400;color:var(--chrome-muted);margin-left:5px;font-size:13px;letter-spacing:.18em;text-transform:uppercase;vertical-align:2px}
.spacer{flex:1}
.pill{display:inline-flex;align-items:center;gap:6px;border:1px solid color-mix(in srgb,var(--gilt) 35%,transparent);background:color-mix(in srgb,var(--chrome-ink) 4%,transparent);border-radius:999px;padding:7px 14px;font-weight:600;font-size:15px;white-space:nowrap}
.pill:hover{background:color-mix(in srgb,var(--gilt) 12%,transparent)}
.pill .caret{opacity:.6;font-size:11px}
.icon-btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:38px;min-width:38px;padding:0 10px;border-radius:10px;border:1px solid transparent;background:transparent;font-size:14px;font-weight:600;color:var(--chrome-ink)}
.icon-btn:hover{background:color-mix(in srgb,var(--chrome-ink) 7%,transparent)}
.icon-btn svg{width:20px;height:20px}
#authBtn{white-space:nowrap;border:1px solid color-mix(in srgb,var(--gilt) 40%,transparent);color:var(--gilt-soft)}
#authBtn.in{border-radius:50%;width:34px;min-width:34px;height:34px;padding:0;background:color-mix(in srgb,var(--gilt) 22%,transparent);font-weight:700}
.icon-btn.gold{color:var(--gilt-soft);border-color:color-mix(in srgb,var(--gilt) 40%,transparent)}
.lbl-wide{display:inline}
@media (max-width:700px){.lbl-wide{display:none}.brand .wm{display:none}.brand .mark{width:26px;height:26px}#authBtn:not(.in){width:34px;padding:0}.top{gap:4px;padding:8px 8px}.pill{padding:6px 9px;font-size:14px;gap:4px}.icon-btn{min-width:34px;padding:0 6px}.brand svg{width:20px}}
@media (max-width:360px){.brand{display:none}}

/* ---------- stage & book ---------- */
.stage{position:relative;display:flex;align-items:stretch;justify-content:center;padding:18px 16px 10px;min-height:0}
.book{position:relative;width:min(1240px,100%);height:100%;perspective:2600px}
.sheet{position:absolute;top:0;bottom:0;background:var(--paper);box-shadow:0 18px 40px rgba(0,0,0,.45),0 2px 0 var(--paper-edge),0 4px 0 #d8caa9,0 6px 0 var(--paper-edge)}
.sheet.l{left:0;width:50%;border-radius:8px 2px 2px 8px;background-image:linear-gradient(90deg,transparent 88%,rgba(0,0,0,.10) 99%,rgba(0,0,0,.18))}
.sheet.r{right:0;width:50%;border-radius:2px 8px 8px 2px;background-image:linear-gradient(270deg,transparent 88%,rgba(0,0,0,.08) 99%,rgba(0,0,0,.16))}
.sheet.full{left:0;right:0;border-radius:6px;background-image:linear-gradient(90deg,rgba(0,0,0,.10),transparent 4%)}
.book.single .sheet.l,.book.single .sheet.r{display:none}
.book:not(.single) .sheet.full{display:none}
.book{--jesus:#b3261e;--name:#25628f}
.book[data-tone="night"],.book[data-tone="black"]{--jesus:#ff8f86;--name:#8cc8ff}
.book[data-tone="ivory"]{--paper:#ffffff;--paper-edge:#efeadf;--ink:#22201c;--ink-muted:#8a8378;--rule:#e9e3d6}
.book[data-tone="sage"]{--paper:#dfe9d6;--paper-edge:#cbd9bf;--ink:#25302a;--ink-muted:#6f7d72;--rule:#d6decc;--page-accent:#4f7a52}
.book[data-tone="mist"]{--paper:#dde6ee;--paper-edge:#c9d5e0;--ink:#232a31;--ink-muted:#6f7a85;--rule:#d9dfe5;--page-accent:#1f6f78}
.book[data-tone="blush"]{--paper:#f5dfe2;--paper-edge:#e9c9ce;--ink:#33262a;--ink-muted:#8e7479;--rule:#ead6d8;--page-accent:#9c4468}
.book[data-tone="black"]{--paper:#050505;--paper-edge:#141414;--ink:#cfcac2;--ink-muted:#7d786f;--rule:#222;--page-accent:#c9a34e;--hl-yellow:rgba(230,190,60,.30);--hl-green:rgba(110,190,110,.28);--hl-blue:rgba(100,160,235,.30);--hl-pink:rgba(235,120,160,.28);--hl-purple:rgba(160,120,230,.30)}
.book[data-tone="sepia"]{--paper:#ead9b4;--paper-edge:#dfcfac;--ink:#3b2e1d;--ink-muted:#8a7454;--rule:#d9c69e}
.book[data-tone="night"]{--paper:#1c1a17;--paper-edge:#2a2621;--ink:#ddd2bd;--ink-muted:#9a8e7a;--rule:#3a342c;--hl-yellow:rgba(230,190,60,.30);--hl-green:rgba(110,190,110,.28);--hl-blue:rgba(100,160,235,.30);--hl-pink:rgba(235,120,160,.28);--hl-purple:rgba(160,120,230,.30)}
.runhead{position:absolute;top:12px;font-family:var(--display);font-size:13px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-muted);pointer-events:none;white-space:nowrap}
.folio{position:absolute;bottom:12px;font-family:var(--display);font-size:14px;color:var(--ink-muted);pointer-events:none}
.ribbon{position:absolute;top:-6px;width:18px;height:40px;background:linear-gradient(90deg,#7e1c2e,var(--ribbon) 40%,#c23a52 60%,#7e1c2e);border:0;padding:0;z-index:6;clip-path:polygon(0 0,100% 0,100% 100%,50% 86%,0 100%);transition:height .25s ease;box-shadow:0 2px 6px rgba(0,0,0,.3)}
.ribbon:hover{height:44px}
.ribbon.off{opacity:.3;height:30px}
.ribbon.off:hover{height:34px}
.ribbon.off:hover{opacity:.7}

.viewport{position:absolute;overflow:hidden;z-index:2}
.flow{position:relative;height:100%;color:var(--ink);font-family:var(--body);font-size:var(--fs);line-height:1.72;column-fill:auto;transition:transform .0s;hyphens:auto;-webkit-hyphens:auto;text-align:justify}
.book[data-font="garamond"] .flow{font-family:"EB Garamond",Georgia,serif;font-size:calc(var(--fs) * 1.08)}
.book[data-font="sans"] .flow{font-family:var(--ui);text-align:left}
.book[data-font="crimson"] .flow{font-family:"Crimson Pro",Georgia,serif;font-size:calc(var(--fs) * 1.1)}
.book[data-font="lora"] .flow{font-family:"Lora",Georgia,serif}
.book[data-font="source"] .flow{font-family:"Source Serif 4",Georgia,serif}
.book[data-font="merri"] .flow{font-family:"Merriweather",Georgia,serif;font-size:calc(var(--fs) * .94)}
.book[data-font="atkinson"] .flow{font-family:"Atkinson Hyperlegible",system-ui,sans-serif;text-align:left}
.book[data-font="newsreader"] .flow{font-family:"Newsreader",Georgia,serif;font-size:calc(var(--fs) * 1.04)}
.fontgrid,.swgrid{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end}
.fontbtn{border:1px solid color-mix(in srgb,var(--chrome-ink) 15%,transparent);background:transparent;border-radius:9px;padding:6px 10px;font-size:15px}
.fontbtn.on{border-color:var(--gilt);background:color-mix(in srgb,var(--gilt) 12%,transparent);box-shadow:inset 0 0 0 1px var(--gilt)}
.tonebtn{display:flex;flex-direction:column;align-items:center;gap:4px;border:0;background:transparent;padding:2px;font-size:11px;font-weight:600;color:var(--chrome-muted);width:46px}
.tonebtn i{width:34px;height:34px;border-radius:50%;border:2px solid color-mix(in srgb,var(--chrome-ink) 20%,transparent);display:block}
.tonebtn.on i{box-shadow:0 0 0 2px var(--leather-2),0 0 0 4px var(--gilt)}
.tonebtn.on{color:var(--chrome-ink)}
.themebtn{display:flex;align-items:center;gap:8px;border:1px solid color-mix(in srgb,var(--chrome-ink) 15%,transparent);background:transparent;border-radius:12px;padding:6px 10px 6px 6px;font-size:13px;font-weight:600}
.themebtn.on{border-color:var(--gilt);box-shadow:inset 0 0 0 1px var(--gilt)}
.themebtn i{width:26px;height:26px;border-radius:8px;display:block;position:relative;overflow:hidden}
.themebtn i b{position:absolute;right:3px;bottom:3px;width:10px;height:10px;border-radius:50%}
.chap-head{break-inside:avoid;margin:0 0 14px;text-align:center}
.chap-head .bk{font-family:var(--display);font-size:1.15em;letter-spacing:.24em;text-transform:uppercase;color:var(--ink-muted)}
.chap-head .num{font-family:var(--display);font-weight:700;font-size:4.2em;line-height:1;color:var(--page-accent);margin-top:2px}
.book[data-tone="night"] .chap-head .num{color:#c9a34e}
.chap-head .orn{display:block;margin:6px auto 0;width:120px;height:10px;color:var(--ink-muted)}
.chap-head .scene-btn{margin-top:10px;font-family:var(--ui);font-size:13px;font-weight:600;letter-spacing:.02em;border:1px solid var(--rule);background:transparent;color:var(--ink);border-radius:999px;padding:6px 14px}
.recall{margin:14px auto 0;max-width:40ch;border:1px dashed var(--rule);border-radius:12px;padding:10px 12px;font-family:var(--ui);font-size:15px;color:var(--ink)}
.chap-head .scene-btn:hover{background:rgba(176,138,54,.12)}
.para{margin:0 0 .7em;text-indent:0}
.v{cursor:pointer;border-radius:3px;box-decoration-break:clone;-webkit-box-decoration-break:clone;transition:background-color .2s}
.v sup{font-family:var(--ui);font-size:.56em;font-weight:700;color:var(--page-accent);margin:0 2px 0 1px;vertical-align:.55em;line-height:0}
.book[data-tone="night"] .v sup{color:#c9a34e}
.book.nonum .v sup{display:none}
.v:hover{background:rgba(176,138,54,.10)}
.v.sel{background:rgba(176,138,54,.20);text-decoration:underline dotted rgba(176,138,54,.9);text-underline-offset:4px}
.v.reading{background:rgba(176,138,54,.30)}
.v.flash{animation:flash 1.6s ease}
@keyframes flash{0%,40%{background:color-mix(in srgb,var(--gilt) 60%,transparent)}100%{background:transparent}}
.v[data-hl="yellow"]{background:var(--hl-yellow)} .v[data-hl="green"]{background:var(--hl-green)} .v[data-hl="blue"]{background:var(--hl-blue)} .v[data-hl="pink"]{background:var(--hl-pink)} .v[data-hl="purple"]{background:var(--hl-purple)}
.v .mk{display:inline-block;width:.5em;height:.5em;border-radius:50%;background:var(--ribbon);margin:0 3px;vertical-align:.25em}
.v .mk.note{background:#3c7c6a}
.jw{color:var(--jesus)}
.nm{color:var(--name);text-decoration:underline;text-decoration-style:dotted;text-decoration-color:color-mix(in srgb,var(--name) 55%,transparent);text-underline-offset:3px;cursor:pointer;border-radius:3px}
.nm:hover{background:color-mix(in srgb,var(--name) 12%,transparent)}
.prel{margin:8px 0}.prl{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--chrome-muted);margin-bottom:4px}
.pchip{border:1px solid color-mix(in srgb,var(--gilt) 40%,transparent);background:color-mix(in srgb,var(--gilt) 8%,transparent);border-radius:999px;padding:5px 11px;font-size:14px;font-weight:600}
.v.missing{color:var(--ink-muted);font-style:italic;font-size:.85em}
.chap-end{break-inside:avoid;margin:28px 0 6px;padding:18px 14px;border-top:1px solid var(--rule);text-align:center;font-family:var(--ui);color:var(--ink)}
.chap-end .t{font-family:var(--display);font-size:1.3em;font-style:italic;color:var(--ink-muted);margin-bottom:12px}
.whybox{text-align:left;margin:14px auto 0;max-width:46ch;break-inside:avoid}
.whyq{border-top:1px solid var(--rule);padding:10px 0}
.whya{margin:8px 0 0;font-size:.92em;color:var(--ink-muted)}
.chap-end .row{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.pbtn{border:1px solid var(--rule);background:transparent;color:var(--ink);border-radius:999px;padding:8px 14px;font-size:14px;font-weight:600;font-family:var(--ui)}
.pbtn:hover{background:rgba(176,138,54,.12)}
.pbtn.done{background:var(--page-accent);color:#fff;border-color:var(--page-accent)}
.endmark{display:inline-block;width:1px;height:1px}

/* scroll mode */
.book.scroll .viewport{overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}
.book.scroll .flow{height:auto !important;column-count:auto !important;columns:auto !important;transform:none !important;max-width:68ch;margin:0 auto;padding-bottom:30px}

/* page turn leaf */
.leaf{position:absolute;top:0;bottom:0;z-index:5;transform-style:preserve-3d;pointer-events:none}
.face{position:absolute;inset:0;background:var(--paper);overflow:hidden;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.face.back{transform:rotateY(180deg)}
.face .shade{position:absolute;inset:0;pointer-events:none}
.static-face{position:absolute;top:0;bottom:0;z-index:4;background:var(--paper);overflow:hidden;pointer-events:none}
.clipbox{position:absolute;overflow:hidden}

.corner{position:absolute;bottom:0;width:64px;height:64px;z-index:3;border:0;background:transparent;padding:0}
.corner.next{right:0}.corner.prev{left:0}
.corner::after{content:"";position:absolute;bottom:0;width:0;height:0;transition:all .2s ease}
.corner.next::after{right:0;background:linear-gradient(315deg,transparent 50%,rgba(0,0,0,.08) 50%,var(--paper-edge) 70%)}
.corner.prev::after{left:0;background:linear-gradient(45deg,transparent 50%,rgba(0,0,0,.08) 50%,var(--paper-edge) 70%)}
.corner:hover::after{width:34px;height:34px}

/* ---------- bottom bar ---------- */
.bottom{display:flex;align-items:center;justify-content:center;gap:12px;padding:8px 16px 12px}
.pageinfo{min-width:0;text-align:center;font-size:13px;color:var(--chrome-muted);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pageinfo b{color:var(--chrome-ink);font-weight:600}
.prog{height:3px;width:min(220px,40vw);background:color-mix(in srgb,var(--chrome-ink) 10%,transparent);border-radius:3px;overflow:hidden;margin:5px auto 0}
.prog i{display:block;height:100%;background:var(--gilt);width:0;transition:width .3s}
.turn-btn{width:44px;height:44px;border-radius:50%;border:1px solid color-mix(in srgb,var(--gilt) 35%,transparent);background:color-mix(in srgb,var(--chrome-ink) 3%,transparent);display:flex;align-items:center;justify-content:center}
.turn-btn:hover{background:color-mix(in srgb,var(--gilt) 14%,transparent)}
.turn-btn svg{width:20px;height:20px}
.tools-r{position:absolute;right:16px;display:flex;gap:4px}
.narr{text-decoration:none}
@media (max-width:700px){.tools-r{position:static}.bottom{gap:6px;padding:8px 10px 12px}}

/* ---------- verse action bar ---------- */
.actionbar{position:fixed;left:50%;bottom:74px;transform:translate(-50%,20px);opacity:0;pointer-events:none;z-index:30;background:var(--leather-2);border:1px solid color-mix(in srgb,var(--gilt) 35%,transparent);border-radius:16px;box-shadow:0 14px 40px rgba(0,0,0,.5);padding:10px 12px;display:flex;flex-direction:column;gap:8px;width:min(560px,calc(100% - 24px));transition:all .22s ease}
.actionbar.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.ab-top{display:flex;align-items:center;gap:8px}
.ab-ref{font-weight:700;color:var(--gilt-soft);font-size:15px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.swatches{display:flex;gap:7px}
.sw{width:28px;height:28px;border-radius:50%;border:2px solid color-mix(in srgb,var(--chrome-ink) 18%,transparent);padding:0}
.sw[data-c="yellow"]{background:#f3cf4f}.sw[data-c="green"]{background:#78c070}.sw[data-c="blue"]{background:#6ea6ef}.sw[data-c="pink"]{background:#ef84ab}.sw[data-c="purple"]{background:#a986e8}
.sw.on{border-color:#fff;box-shadow:0 0 0 2px var(--gilt)}
.sw.clear{background:transparent;display:flex;align-items:center;justify-content:center;font-size:14px;color:var(--chrome-muted)}
.ab-actions{display:flex;gap:4px;flex-wrap:wrap}
.ab-actions .icon-btn{font-size:13px;height:34px;padding:0 10px;background:color-mix(in srgb,var(--chrome-ink) 4%,transparent)}
.ab-actions .icon-btn.primary{background:var(--gilt);color:var(--on-accent)}
.ab-actions .icon-btn.primary:hover{background:var(--gilt-soft)}

.player{position:fixed;left:50%;transform:translateX(-50%);bottom:72px;z-index:25;width:min(560px,calc(100% - 20px));display:flex;align-items:center;gap:10px;background:var(--leather-2);border:1px solid color-mix(in srgb,var(--gilt) 40%,transparent);border-radius:16px;padding:8px 10px;box-shadow:0 12px 30px rgba(0,0,0,.45)}
.player[hidden]{display:none}
.pl-btn{width:44px;height:44px;border-radius:50%;border:0;background:var(--gilt);color:var(--on-accent);font-weight:800;font-size:15px;flex:none}
.pl-btn.sm{width:36px;height:36px;background:color-mix(in srgb,var(--chrome-ink) 6%,transparent);color:var(--chrome-ink);font-size:13px}
.pl-info{flex:1;min-width:0}
.pl-t{display:flex;justify-content:space-between;gap:8px;font-size:14px}.pl-t span{color:var(--chrome-muted);font-variant-numeric:tabular-nums;font-size:12px}
.pl-bar{height:6px;border-radius:4px;background:color-mix(in srgb,var(--chrome-ink) 12%,transparent);margin:6px 0 4px;cursor:pointer;overflow:hidden}.pl-bar i{display:block;height:100%;width:0;background:var(--gilt)}
.pl-s{font-size:11px;color:var(--chrome-muted)}
body.playing:not(.plmin) .actionbar{bottom:142px}
body.playing:not(.plmin) .stage{padding-bottom:84px}
body.plmin #player{display:none}
body.playing #narrBtn{color:var(--gilt-soft);border-color:color-mix(in srgb,var(--gilt) 50%,transparent);background:color-mix(in srgb,var(--gilt) 14%,transparent)}
body.playing #narrBtn::after{content:"";width:7px;height:7px;border-radius:50%;background:var(--gilt);margin-left:4px;animation:pulse 1.4s infinite}
@keyframes pulse{50%{opacity:.25}}
/* ---------- drawers / sheets ---------- */
.scrim{position:fixed;inset:0;background:rgba(5,8,12,.5);opacity:0;pointer-events:none;transition:opacity .25s;z-index:40}
.scrim.show{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;bottom:0;width:min(440px,100%);background:var(--leather-2);z-index:50;display:flex;flex-direction:column;transition:transform .3s cubic-bezier(.3,.7,.2,1);box-shadow:0 0 50px rgba(0,0,0,.6)}
.drawer.right{right:0;transform:translateX(105%);border-left:1px solid color-mix(in srgb,var(--gilt) 20%,transparent)}
.drawer.left{left:0;transform:translateX(-105%);border-right:1px solid color-mix(in srgb,var(--gilt) 20%,transparent)}
.drawer.open{transform:none}
@media (max-width:700px){
  .drawer{top:auto;height:88%;width:100%;border-radius:18px 18px 0 0;border:0;border-top:1px solid color-mix(in srgb,var(--gilt) 30%,transparent)}
  .drawer.right,.drawer.left{transform:translateY(105%)}
  .drawer.open{transform:none}
}
.dh{display:flex;align-items:center;gap:8px;padding:14px 16px 8px}
.dh h2{margin:0;font-family:var(--display);font-size:26px;font-weight:600;color:var(--gilt-soft);flex:1}
.tabs{display:flex;gap:4px;padding:0 12px 10px;border-bottom:1px solid color-mix(in srgb,var(--chrome-ink) 7%,transparent);overflow-x:auto}
.tab{border:0;background:transparent;padding:8px 12px;border-radius:9px;font-weight:600;font-size:14px;color:var(--chrome-muted);white-space:nowrap}
.tab.on{background:color-mix(in srgb,var(--gilt) 16%,transparent);color:var(--gilt-soft)}
.dbody{flex:1;overflow-y:auto;padding:14px 16px 28px;-webkit-overflow-scrolling:touch}
.card{background:var(--leather-3);border:1px solid color-mix(in srgb,var(--chrome-ink) 6%,transparent);border-radius:14px;padding:14px;margin-bottom:12px}
.card h3{margin:0 0 6px;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--gilt);font-weight:700;display:flex;align-items:center;gap:8px}
.card h3 .save{margin-left:auto}
.card p{margin:0;line-height:1.6;font-size:15px}
.scripture{font-family:var(--body);font-size:17px;line-height:1.65;color:var(--chrome-ink)}
.reflabel{font-weight:700;color:var(--gilt-soft)}
.mini{border:1px solid color-mix(in srgb,var(--gilt) 35%,transparent);background:transparent;border-radius:999px;padding:4px 10px;font-size:12px;font-weight:600;color:var(--gilt-soft);letter-spacing:0;text-transform:none}
.mini:hover{background:color-mix(in srgb,var(--gilt) 14%,transparent)}
.mini.saved{background:rgba(120,192,112,.18);border-color:rgba(120,192,112,.5);color:var(--good)}
.cmp{display:grid;gap:10px}
.cmp .row{display:grid;grid-template-columns:52px 1fr;gap:10px;align-items:baseline}
.cmp .tag{font-size:11px;font-weight:700;letter-spacing:.08em;color:var(--chrome-muted)}
.cmp .txt{font-family:var(--body);font-size:15px;line-height:1.55}
.orig{font-family:var(--greek);font-size:18px}
.orig.he{font-family:var(--hebrew);direction:rtl;text-align:right;font-size:21px;line-height:1.9}
.words{display:grid;gap:10px}
.word{border-left:3px solid var(--gilt);padding:4px 0 4px 12px}
.word .o{font-family:var(--greek);font-size:22px;color:var(--chrome-ink)}
.word .o.he{font-family:var(--hebrew)}
.word .tr{font-style:italic;color:var(--chrome-muted);margin-left:8px;font-size:14px}
.word .en{font-weight:700;font-size:14px;margin-top:2px}
.word .m{font-size:14px;line-height:1.55;color:var(--chrome-ink);margin-top:2px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid color-mix(in srgb,var(--gilt) 35%,transparent);background:color-mix(in srgb,var(--gilt) 6%,transparent);border-radius:10px;padding:8px 10px;text-align:left;font-size:13px;line-height:1.35;max-width:100%}
.chip b{display:block;color:var(--gilt-soft);font-size:14px}
.chip:hover{background:color-mix(in srgb,var(--gilt) 15%,transparent)}
.skel{height:12px;border-radius:6px;background:linear-gradient(90deg,color-mix(in srgb,var(--chrome-ink) 5%,transparent),color-mix(in srgb,var(--chrome-ink) 12%,transparent),color-mix(in srgb,var(--chrome-ink) 5%,transparent));background-size:200% 100%;animation:sh 1.3s infinite;margin:8px 0}
@keyframes sh{to{background-position:-200% 0}}
.muted{color:var(--chrome-muted);font-size:14px;line-height:1.55}
.err{color:var(--bad);font-size:14px;line-height:1.5}
.bigbtn{width:100%;border:0;border-radius:12px;padding:12px 14px;background:var(--gilt);color:var(--on-accent);font-weight:700;font-size:15px}
.bigbtn:hover{background:var(--gilt-soft)}
.bigbtn:disabled{opacity:.6;cursor:default}
.ghostbtn{border:1px solid color-mix(in srgb,var(--chrome-ink) 15%,transparent);background:transparent;border-radius:10px;padding:9px 12px;font-weight:600;font-size:14px}
.ghostbtn:hover{background:color-mix(in srgb,var(--chrome-ink) 6%,transparent)}

/* chat */
.chat{display:flex;flex-direction:column;gap:12px}
.msg{max-width:92%;padding:11px 13px;border-radius:14px;font-size:15px;line-height:1.6;white-space:pre-wrap;word-wrap:break-word}
.msg.u{align-self:flex-end;background:color-mix(in srgb,var(--gilt) 18%,transparent);border-bottom-right-radius:4px}
.msg.a{align-self:flex-start;background:var(--leather-3);border-bottom-left-radius:4px}
.msg .foot{margin-top:8px;display:flex;gap:6px}
.composer{display:flex;gap:8px;padding:10px 12px;border-top:1px solid color-mix(in srgb,var(--chrome-ink) 7%,transparent);background:var(--leather-2)}
.composer textarea{flex:1;resize:none;border-radius:12px;border:1px solid color-mix(in srgb,var(--chrome-ink) 14%,transparent);background:var(--field);color:var(--chrome-ink);padding:10px 12px;font:15px/1.4 var(--ui);height:46px;max-height:120px}
.micbtn{flex:none;width:46px;border:1px solid color-mix(in srgb,var(--chrome-ink) 18%,transparent)!important;background:transparent!important;color:var(--chrome-ink)!important;border-radius:12px;display:flex;align-items:center;justify-content:center;padding:0!important}
.micbtn.rec{background:var(--bad)!important;color:#fff!important;border-color:var(--bad)!important;animation:pulse 1.2s infinite}
.micbtn.busy{opacity:.6}
.composer button{border:0;border-radius:12px;background:var(--gilt);color:var(--on-accent);font-weight:700;padding:0 16px}
.ctx{font-size:12px;color:var(--chrome-muted);padding:0 14px 6px}
.suggest{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:8px}

/* journal */
.filters{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.fchip{display:inline-flex;align-items:center;gap:6px;border:1px solid color-mix(in srgb,var(--chrome-ink) 12%,transparent);background:transparent;border-radius:999px;padding:5px 10px;font-size:13px;font-weight:600}
.fchip.on{border-color:var(--gilt);background:color-mix(in srgb,var(--gilt) 14%,transparent)}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block}
.dot.yellow{background:#f3cf4f}.dot.green{background:#78c070}.dot.blue{background:#6ea6ef}.dot.pink{background:#ef84ab}.dot.purple{background:#a986e8}
.item{position:relative;background:var(--leather-3);border-radius:12px;padding:12px 12px 10px 16px;margin-bottom:10px;border:1px solid color-mix(in srgb,var(--chrome-ink) 5%,transparent);overflow:hidden}
.item .bar{position:absolute;left:0;top:0;bottom:0;width:5px}
.item .bar.yellow{background:#f3cf4f}.item .bar.green{background:#78c070}.item .bar.blue{background:#6ea6ef}.item .bar.pink{background:#ef84ab}.item .bar.purple{background:#a986e8}
.item .ttl{font-weight:700;color:var(--gilt-soft);font-size:14px;display:flex;gap:8px;align-items:center}
.item .ttl .k{font-size:11px;color:var(--chrome-muted);font-weight:600;letter-spacing:.06em;text-transform:uppercase}
.item .txt{font-family:var(--body);font-size:15px;line-height:1.55;margin:6px 0 8px;color:var(--chrome-ink);white-space:pre-wrap}
.item .acts{display:flex;gap:6px;flex-wrap:wrap}
.empty{text-align:center;padding:30px 10px;color:var(--chrome-muted);line-height:1.6;font-size:14px}
.empty .big{font-family:var(--display);font-size:22px;color:var(--chrome-ink);margin-bottom:4px}
.cat-edit{display:flex;gap:6px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
.cat-edit input{background:var(--field);border:1px solid color-mix(in srgb,var(--chrome-ink) 14%,transparent);border-radius:8px;color:var(--chrome-ink);padding:6px 8px;font:14px var(--ui);width:120px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.stat{background:var(--leather-3);border-radius:14px;padding:14px;text-align:center}
.stat .n{font-family:var(--display);font-size:40px;font-weight:700;color:var(--gilt-soft);line-height:1}
.stat .l{font-size:12px;color:var(--chrome-muted);margin-top:4px;letter-spacing:.06em;text-transform:uppercase}
.bookgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:6px}
.bt{position:relative;border-radius:8px;background:color-mix(in srgb,var(--chrome-ink) 5%,transparent);padding:8px 4px 10px;font-size:11px;font-weight:600;text-align:center;overflow:hidden;border:0;color:var(--chrome-ink)}
.bt i{position:absolute;left:0;bottom:0;height:4px;background:var(--gilt)}
.bt.full{background:color-mix(in srgb,var(--gilt) 25%,transparent)}
.sec-h{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--gilt);font-weight:700;margin:16px 0 8px}

/* modal (picker, settings, translation, note) */
.modal{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:60;padding:16px;pointer-events:none}
.modal .box{pointer-events:none;visibility:hidden;background:var(--leather-2);border:1px solid color-mix(in srgb,var(--gilt) 30%,transparent);border-radius:18px;width:min(760px,100%);max-height:min(86vh,100%);display:flex;flex-direction:column;box-shadow:0 30px 80px rgba(0,0,0,.6);opacity:0;transform:translateY(12px) scale(.98);transition:opacity .22s ease,transform .22s ease,visibility 0s linear .22s}
.modal.show .box{opacity:1;transform:none;pointer-events:auto;visibility:visible;transition-delay:0s}
.modal.small .box{width:min(440px,100%)}
.mbody{overflow-y:auto;padding:4px 18px 20px}
.goto{display:flex;gap:8px;margin:4px 0 14px}
.goto input{flex:1;background:var(--field);border:1px solid color-mix(in srgb,var(--chrome-ink) 14%,transparent);border-radius:12px;color:var(--chrome-ink);padding:11px 14px;font:16px var(--ui)}
.goto button{border:0;border-radius:12px;background:var(--gilt);color:var(--on-accent);font-weight:700;padding:0 16px}
.testament{font-family:var(--display);font-size:20px;color:var(--gilt-soft);margin:12px 0 8px}
.bgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:6px}
.bk-btn{text-align:left;border:1px solid color-mix(in srgb,var(--chrome-ink) 7%,transparent);background:color-mix(in srgb,var(--chrome-ink) 3%,transparent);border-radius:10px;padding:9px 10px;font-size:14px;font-weight:600;position:relative;overflow:hidden}
.bk-btn:hover{border-color:color-mix(in srgb,var(--gilt) 50%,transparent)}
.bk-btn.cur{border-color:var(--gilt);background:color-mix(in srgb,var(--gilt) 12%,transparent)}
.bk-btn i{position:absolute;left:0;bottom:0;height:3px;background:var(--gilt);opacity:.8}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(48px,1fr));gap:6px}
.ch-btn{height:46px;border-radius:10px;border:1px solid color-mix(in srgb,var(--chrome-ink) 8%,transparent);background:color-mix(in srgb,var(--chrome-ink) 3%,transparent);font-weight:700;font-variant-numeric:tabular-nums;position:relative}
.ch-btn:hover{border-color:var(--gilt)}
.ch-btn.read{background:color-mix(in srgb,var(--gilt) 18%,transparent)}
.ch-btn.cur{border-color:var(--gilt);box-shadow:inset 0 0 0 1px var(--gilt)}
.votd{background:linear-gradient(135deg,color-mix(in srgb,var(--gilt) 18%,transparent),color-mix(in srgb,var(--ribbon) 14%,transparent));border:1px solid color-mix(in srgb,var(--gilt) 30%,transparent);border-radius:14px;padding:14px 16px;margin-bottom:6px}
.votd .k{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--gilt);font-weight:700}
.votd .t{font-family:var(--body);font-size:17px;line-height:1.6;margin:6px 0}
.votd .r{font-weight:700;color:var(--gilt-soft);font-size:14px}
.trlist{display:grid;gap:8px}
.tr-btn{display:grid;grid-template-columns:64px 1fr;gap:10px;align-items:center;text-align:left;border:1px solid color-mix(in srgb,var(--chrome-ink) 8%,transparent);background:color-mix(in srgb,var(--chrome-ink) 3%,transparent);border-radius:12px;padding:12px}
.tr-btn.on{border-color:var(--gilt);background:color-mix(in srgb,var(--gilt) 12%,transparent)}
.tr-btn .ab{font-family:var(--display);font-weight:700;font-size:22px;color:var(--gilt-soft)}
.tr-btn .nm{font-weight:700;font-size:15px}
.tr-btn .ds{font-size:13px;color:var(--chrome-muted);margin-top:2px}
.ext{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.ext a{color:var(--gilt-soft);font-weight:600;font-size:14px;border:1px solid color-mix(in srgb,var(--gilt) 30%,transparent);border-radius:999px;padding:6px 12px;text-decoration:none}
.set-row{flex-wrap:wrap;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid color-mix(in srgb,var(--chrome-ink) 6%,transparent)}
.set-row .l{font-weight:600}
.seg{flex-wrap:wrap;display:inline-flex;background:var(--field);border-radius:10px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;border-radius:8px;padding:7px 12px;font-size:13px;font-weight:600;color:var(--chrome-muted)}
.seg button.on{background:var(--gilt);color:var(--on-accent)}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.field label{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--chrome-muted);font-weight:700}
.field input,.field textarea{background:var(--field);border:1px solid color-mix(in srgb,var(--chrome-ink) 14%,transparent);border-radius:10px;color:var(--chrome-ink);padding:10px 12px;font:15px/1.5 var(--ui)}
.field textarea{min-height:180px;resize:vertical}
.row-btns{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.danger{color:var(--bad)}

.grp{background:color-mix(in srgb,var(--chrome-ink) 2%,transparent);border:1px solid color-mix(in srgb,var(--chrome-ink) 7%,transparent);border-radius:12px;margin-bottom:8px;padding:0 8px}
.grp>summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;padding:12px 6px;font-weight:700;font-family:var(--display);font-size:20px;color:var(--gilt-soft)}
.grp>summary::-webkit-details-marker{display:none}
.grp>summary::after{content:"▸";color:var(--chrome-muted);font-size:14px;margin-left:8px}
.grp[open]>summary::after{content:"▾"}
.grp .cnt{margin-left:auto;font-family:var(--ui);font-size:12px;color:var(--chrome-muted);background:color-mix(in srgb,var(--chrome-ink) 6%,transparent);border-radius:999px;padding:2px 9px}
.hlbooks{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:6px}
.hlbook{display:flex;justify-content:space-between;align-items:center;gap:6px;text-align:left;border:1px solid color-mix(in srgb,var(--gilt) 35%,transparent);background:color-mix(in srgb,var(--gilt) 8%,transparent);border-radius:10px;padding:10px 12px;font-weight:600;font-size:14px}
.hlbook:hover{background:color-mix(in srgb,var(--gilt) 16%,transparent)}
.hlbook .cnt{font-size:12px;font-weight:700;background:var(--gilt);color:var(--on-accent);border-radius:999px;padding:1px 8px}
.hlbook.none{opacity:.35;border-color:color-mix(in srgb,var(--chrome-ink) 8%,transparent);background:transparent;cursor:default}
.hlbook.none .cnt{background:color-mix(in srgb,var(--chrome-ink) 10%,transparent);color:var(--chrome-muted)}
.item.note .nhead{display:flex;flex-direction:column;align-items:flex-start;gap:3px;width:100%;text-align:left;border:0;background:transparent;padding:0;color:inherit}
.item.note .nhead .k{font-size:11px;color:var(--chrome-muted);font-weight:600;letter-spacing:.04em;text-transform:uppercase}
.item.note .txt.clamp{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin:6px 0 2px}
.item.note.open .txt.clamp{display:block;-webkit-line-clamp:unset}
.pin{margin-right:4px}
.jsearch{display:flex;gap:8px;margin:0 0 12px}
.hit{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--gilt)}
.tl{position:relative;margin:10px 0 16px;padding-left:6px}
.tl-i{display:flex;gap:12px;align-items:flex-start;position:relative;padding:6px 0 10px}
.tl-i:not(:last-child)::before{content:"";position:absolute;left:6px;top:20px;bottom:-4px;width:2px;background:color-mix(in srgb,var(--chrome-ink) 15%,transparent)}
.tl-dot{width:14px;height:14px;border-radius:50%;border:2px solid color-mix(in srgb,var(--chrome-ink) 30%,transparent);background:var(--leather-2);flex:none;margin-top:3px;z-index:1}
.tl-i.past .tl-dot{background:color-mix(in srgb,var(--gilt) 45%,transparent);border-color:transparent}
.tl-i.here .tl-dot{background:var(--gilt);border-color:var(--gilt);box-shadow:0 0 0 4px color-mix(in srgb,var(--gilt) 25%,transparent)}
.tl-n{font-weight:700;font-size:15px}.tl-i.here .tl-n{color:var(--gilt)}
.tl-d{font-size:13px;color:var(--chrome-muted)}
.ring{display:flex;align-items:center;gap:14px}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(98px,1fr));gap:8px}
.badge{text-align:center;border:1px solid color-mix(in srgb,var(--chrome-ink) 10%,transparent);border-radius:12px;padding:10px 6px;font-size:12px;font-weight:600}
.badge .ic{font-size:26px;display:block;margin-bottom:4px}
.badge.lock{opacity:.35;filter:grayscale(1)}
.plan{border:1px solid color-mix(in srgb,var(--chrome-ink) 12%,transparent);border-radius:12px;padding:12px;margin-bottom:8px;text-align:left;width:100%;background:transparent}
.plan b{display:block;font-size:15px}.plan span{font-size:13px;color:var(--chrome-muted)}
.daych{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid color-mix(in srgb,var(--chrome-ink) 8%,transparent)}
.daych .ck{width:22px;height:22px;border-radius:50%;border:2px solid color-mix(in srgb,var(--chrome-ink) 25%,transparent);display:flex;align-items:center;justify-content:center;font-size:13px;flex:none}
.daych .ck.on{background:var(--good);border-color:var(--good);color:#fff}
.chal{border:1px solid color-mix(in srgb,var(--gilt) 40%,transparent);background:color-mix(in srgb,var(--gilt) 7%,transparent);border-radius:14px;padding:14px;margin-bottom:14px}
.ans{border-top:1px solid color-mix(in srgb,var(--chrome-ink) 10%,transparent);padding:8px 0;font-size:14px;line-height:1.5}
.recolor{display:flex;align-items:center;gap:7px;margin:0 0 8px}
.rc.dot{width:20px;height:20px;border:2px solid color-mix(in srgb,var(--chrome-ink) 15%,transparent);padding:0;cursor:pointer}
.rc.dot.on{border-color:#fff;box-shadow:0 0 0 2px var(--gilt)}
.search{flex:1;min-width:150px;background:var(--field);border:1px solid color-mix(in srgb,var(--chrome-ink) 14%,transparent);border-radius:10px;color:var(--chrome-ink);padding:9px 12px;font:15px var(--ui)}
/* leaderboard */
.lb-row{display:grid;grid-template-columns:34px 36px 1fr auto;gap:10px;align-items:center;padding:10px 12px;border-radius:12px;background:var(--leather-3);margin-bottom:8px;border:1px solid transparent}
.lb-row.me{border-color:var(--gilt);background:color-mix(in srgb,var(--gilt) 12%,transparent)}
.lb-rank{font-family:var(--display);font-size:22px;font-weight:700;text-align:center;color:var(--chrome-muted)}
.lb-rank.m1{color:#e8c25a}.lb-rank.m2{color:#c9d0d8}.lb-rank.m3{color:#d49a63}
.lb-av{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;background:color-mix(in srgb,var(--gilt) 20%,transparent);color:var(--gilt-soft)}
.lb-name{font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lb-val{font-family:var(--display);font-size:22px;font-weight:700;color:var(--gilt-soft);font-variant-numeric:tabular-nums}
.statchips{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:10px}
.statchips .fchip{white-space:nowrap}
/* quiz */
.q{margin-bottom:16px}
.q .qt{font-weight:700;font-size:15px;line-height:1.5;margin-bottom:8px}
.opt{display:block;width:100%;text-align:left;border:1px solid color-mix(in srgb,var(--chrome-ink) 10%,transparent);background:color-mix(in srgb,var(--chrome-ink) 3%,transparent);border-radius:10px;padding:10px 12px;margin-bottom:6px;font-size:14px;line-height:1.45}
.opt:hover{border-color:var(--gilt)}
.opt.right{border-color:#78c070;background:rgba(120,192,112,.18)}
.opt.wrong{border-color:#e07a7a;background:rgba(224,122,122,.15)}
.q .why{font-size:14px;color:var(--chrome-ink);line-height:1.5;margin-top:4px}

.ver{position:fixed;left:8px;bottom:4px;font-size:10px;color:var(--chrome-muted);opacity:.6;z-index:20;pointer-events:none;font-variant-numeric:tabular-nums}
.toast{position:fixed;left:50%;top:70px;transform:translate(-50%,-10px);background:var(--gilt);color:var(--on-accent);font-weight:700;padding:10px 16px;border-radius:999px;z-index:90;opacity:0;pointer-events:none;transition:all .25s;font-size:14px;box-shadow:0 10px 30px rgba(0,0,0,.4)}
.toast.show{opacity:1;transform:translate(-50%,0)}
.sparkle{position:fixed;z-index:95;pointer-events:none;width:8px;height:8px;border-radius:50%;background:var(--gilt-soft)}
.loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--ink-muted);font-family:var(--display);font-size:22px;font-style:italic;z-index:3}
@media (prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important}}
</style>
</head>

function h(tag, props, ...kids){
  const el = document.createElement(tag);
  if (props) for (const [k,v] of Object.entries(props)){
    if (v===false || v==null) continue;
    if (k.startsWith("on") && typeof v==="function") el.addEventListener(k.slice(2).toLowerCase(), v);
    else if (k==="class") el.className = v;
    else if (k==="text") el.textContent = v;
    else if (k==="style") el.style.cssText = v;
    else el.setAttribute(k, v===true ? "" : v);
  }
  for (const c of kids.flat()){ if (c==null || c===false) continue; el.append(c.nodeType ? c : document.createTextNode(String(c))); }
  return el;
}

function findBook(name){
  name=name.toLowerCase().replace(/\./g,"").replace(/^(i{1,3})\s/, m=>({"i ":"1 ","ii ":"2 ","iii ":"3 "})[m]).replace(/^(first|second|third)\s/,m=>({"first ":"1 ","second ":"2 ","third ":"3 "})[m]).trim();
  if (name in ALIASES) return ALIASES[name];
  const compact=name.replace(/\s/g,"");
  for (let i=0;i<BOOKS.length;i++){ const n=BOOKS[i][1].toLowerCase().replace(/\s/g,""); if (compact.length>=2 && n.startsWith(compact)) return i; }
  return -1;
}
function parseRef(str){
  const m = String(str).trim().match(/^((?:[1-3]|i{1,3})?\s*[a-zA-Z][a-zA-Z .]*?)\s*(\d+)?(?:\s*[:.]\s*(\d+)(?:\s*[-–]\s*(\d+))?)?\s*$/i);
  if (!m) return null;
  const b=findBook(m[1]); if (b<0) return null;
  const c=Math.min(Math.max(+(m[2]||1),1),BOOKS[b][2]);
  return {b,c,v:m[3]?+m[3]:null,v2:m[4]?+m[4]:null};
}

function animateTurn(old, dir){

      } else {

}
async function turn(dir,auto){

async function ttsChunk(text){

  if (HV.cache.has(ck)) return HV.cache.get(ck);

    const body={contents:[{role:"user",parts:[{text:"Read warmly and naturally:\n"+text}]}],
      generationConfig:{responseModalities:["AUDIO"],speechConfig:{voiceConfig:{prebuiltVoiceConfig:{voiceName:voice}}}}};
    let saved=null; try{ saved=localStorage.getItem("lampbible:tts"); }catch(e){}
    const models=saved?[saved,...ttsModels().filter(m=>m!==saved)]:ttsModels();
    for (const model of models){
      const url = CFG.geminiProxy ? `${CFG.geminiProxy.replace(/\/$/,"")}/?model=${encodeURIComponent(model)}` : `https://generativelanguage.googleapis.com/v1beta/models/${model}:streamGenerateContent?alt=sse`;

function splitForSpeech(text){

async function speakHuman(text, onStart){
  const tok=++HV.token; const chunks=splitForSpeech(text); if (!chunks.length) return;

  for (let i=0;i<chunks.length;i++){
    const url=await want(i); if (tok!==HV.token) return;
    want(i+1); want(i+2);
    if (i===0 && onStart) onStart();
    HV.audio.src=url; HV.audio.playbackRate=S.profile.aiRate||1;

    await new Promise((res)=>{ HV.done=res; HV.audio.onended=res; HV.audio.onerror=res; HV.audio.play().catch(err=>{ blocked=err&&err.name==="NotAllowedError"; res(); }); });

}

    db:{ doc:wrapDoc, collection:wrapCol },
    signIn: async()=>{ try{ await signInWithPopup(auth,provider); }catch(e){ if (/popup-blocked|operation-not-supported|web-storage/.test(e.code||"")) await signInWithRedirect(auth,provider); else if (!/popup-closed|cancelled-popup/.test(e.code||"")) throw e; } },
    signOut: ()=>signOut(auth) };
  getRedirectResult(auth).catch(()=>{});
  onAuthStateChanged(auth,u=>{ window.FB.user=u; window.dispatchEvent(new CustomEvent("fb-auth",{detail:u})); });
}
</script>
</body>
</html>
